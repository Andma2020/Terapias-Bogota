    <style>

            background: linear-gradient(135deg, #15B9D9 0%, #EFA286 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            border: none;
            max-width: 600px;
            width: 100%;
        }
        .card-header {
            background: linear-gradient(135deg, #15B9D9 0%, #EFA286 100%);
            color: white;
            border-radius: 20px 20px 0 0 !important;
            padding: 2rem;
            text-align: center;
        }
        .card-body {
            padding: 2rem;
        }
        .btn-primary {
            background: linear-gradient(135deg, #15B9D9 0%, #EFA286 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(21, 185, 217, 0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #198754 0%, #20c997 100%);
            border: none;
            border-radius: 10px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(25, 135, 84, 0.3);
        }
        .status-item {
            padding: 0.75rem;
            margin: 0.5rem 0;
            border-radius: 10px;
            background: #f8f9fa;
            border-left: 4px solid #15B9D9;
        }
        .success { border-left-color: #198754; }
        .error { border-left-color: #dc3545; }
        .info { border-left-color: #0dcaf0; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
            margin: 1.5rem 0;
        }
        .stat-card {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #15B9D9;
        }
        .stat-label {
            font-size: 0.875rem;
            color: #6c757d;
        }
    </style>
</head>

                    </div>
                    
                    <div class="card-body">
                        <div id="status-area">
                            <div class="alert alert-info">

                                <strong>Iniciando carga de datos de prueba...</strong>
                                <p class="mb-0 mt-2">Este proceso cargará automáticamente datos de ejemplo en el sistema.</p>
                            </div>
                        </div>
                        
                        <div id="loading-area" class="text-center my-4" style="display: none;">
                            <div class="loading"></div>
                            <p class="mt-2">Cargando datos...</p>
                        </div>
                        
                        <div id="results-area" style="display: none;">
                            <div class="stats-grid">
                                <div class="stat-card">
                                    <div class="stat-number" id="citas-count">0</div>
                                    <div class="stat-label">Citas</div>
                                </div>
                                <div class="stat-card">
                                    <div class="stat-number" id="contactos-count">0</div>
                                    <div class="stat-label">Contactos</div>
                                </div>
                            </div>
                            
                            <div id="results-content"></div>
                            
                            <div class="d-grid gap-2 mt-4">
                                <a href="admin-login.html" class="btn btn-success btn-lg">
                                    <i class="fas fa-user-shield me-2"></i>Ir al Panel de Administración
                                </a>
                                <button class="btn btn-outline-secondary" onclick="clearTestData()">
                                    <i class="fas fa-trash me-2"></i>Limpiar Datos de Prueba
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        // Cargar datos automáticamente al abrir la página
        window.addEventListener('load', function() {
            setTimeout(loadTestData, 1000); // Esperar 1 segundo antes de cargar
        });

        function loadTestData() {
            const statusArea = document.getElementById('status-area');
            const loadingArea = document.getElementById('loading-area');
            const resultsArea = document.getElementById('results-area');
            const resultsContent = document.getElementById('results-content');
            
            try {
                // Mostrar loading
                loadingArea.style.display = 'block';
                statusArea.innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-spinner fa-spin me-2"></i>
                        <strong>Cargando datos de prueba...</strong>
                    </div>
                `;
                
                // Simular tiempo de carga
                setTimeout(() => {
                    try {
                        // Obtener datos existentes
                        const existingData = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                        
                        // Preparar datos nuevos
                        const newData = {
                            citas: [...(existingData.citas || []), ...testCitas],
                            contactos: [...(existingData.contactos || []), ...testContactos]
                        };
                        
                        // Guardar en localStorage
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(newData));
                        
                        // Ocultar loading
                        loadingArea.style.display = 'none';
                        
                        // Mostrar resultados
                        resultsArea.style.display = 'block';
                        
                        // Actualizar contadores
                        document.getElementById('citas-count').textContent = newData.citas.length;
                        document.getElementById('contactos-count').textContent = newData.contactos.length;
                        
                        // Mostrar detalles
                        resultsContent.innerHTML = `
                            <div class="status-item success">
                                <i class="fas fa-check-circle me-2"></i>
                                <strong>${testCitas.length} citas</strong> cargadas exitosamente
                            </div>
                            <div class="status-item success">
                                <i class="fas fa-check-circle me-2"></i>
                                <strong>${testContactos.length} contactos</strong> cargados exitosamente
                            </div>
                            <div class="status-item info">
                                <i class="fas fa-database me-2"></i>
                                <strong>Total en base de datos:</strong> ${newData.citas.length + newData.contactos.length} registros
                            </div>
                            <div class="status-item info">
                                <i class="fas fa-info-circle me-2"></i>
                                <strong>Estado:</strong> Datos listos para visualizar en el panel de administración
                            </div>
                        `;
                        
                        statusArea.innerHTML = `
                            <div class="alert alert-success">
                                <i class="fas fa-check-circle me-2"></i>
                                <strong>¡Datos de prueba cargados exitosamente!</strong>
                                <p class="mb-0 mt-2">Ahora puedes ver estos datos en el panel de administración.</p>
                            </div>
                        `;
                        
                        console.log('✅ Datos de prueba cargados:', newData);
                        
                    } catch (error) {
                        console.error('Error al cargar datos:', error);
                        loadingArea.style.display = 'none';
                        statusArea.innerHTML = `
                            <div class="alert alert-danger">
                                <i class="fas fa-exclamation-circle me-2"></i>
                                <strong>Error al cargar datos:</strong> ${error.message}
                            </div>
                        `;
                    }
                }, 1500); // Simular 1.5 segundos de carga
                
            } catch (error) {
                console.error('Error general:', error);
                loadingArea.style.display = 'none';
                statusArea.innerHTML = `
                    <div class="alert alert-danger">
                        <i class="fas fa-exclamation-circle me-2"></i>
                        <strong>Error general:</strong> ${error.message}
                    </div>
                `;
            }
        }
        
        function clearTestData() {
            if (!confirm('¿Estás seguro de que quieres eliminar todos los datos de prueba?')) return;
            
            try {
                localStorage.removeItem(STORAGE_KEY);
                
                const statusArea = document.getElementById('status-area');
                statusArea.innerHTML = `
                    <div class="alert alert-warning">
                        <i class="fas fa-trash me-2"></i>
                        <strong>Datos eliminados</strong>
                        <p class="mb-0 mt-2">Todos los datos de prueba han sido eliminados del localStorage.</p>
                    </div>
                `;
                
                document.getElementById('results-area').style.display = 'none';
                
                console.log('✅ Datos de prueba eliminados');
                
            } catch (error) {
                console.error('Error al eliminar datos:', error);
                alert('Error al eliminar datos: ' + error.message);
            }
        }
